server {
    listen 80;
    server_name _;
    root /var/www/wg-monitor/public_html;
    index index.html;
    
    # Basic Authentication
    auth_basic "WireGuard Monitor";
    auth_basic_user_file /var/www/wg-monitor/.htpasswd;
    
    # Логирование с форматом JSON для анализа
    log_format json_log escape=json '{"time":"$time_local",'
                                    '"remote_addr":"$remote_addr",'
                                    '"remote_user":"$remote_user",'
                                    '"request":"$request",'
                                    '"status":"$status",'
                                    '"body_bytes_sent":"$body_bytes_sent",'
                                    '"request_time":"$request_time",'
                                    '"http_referrer":"$http_referer",'
                                    '"http_user_agent":"$http_user_agent"}';
    
    access_log /var/www/wg-monitor/logs/access.log json_log;
    error_log /var/www/wg-monitor/logs/error.log;
    
    # Кэширование статических файлов
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status "HIT";
        access_log off;
    }
    
    # Главная страница
    location / {
        try_files $uri $uri/ =404;
        add_header X-Cache-Status "MISS";
    }
    
    # Облегченная версия
    location /lite {
        alias /var/www/wg-monitor/public_html/lite.html;
    }
    
    # CGI скрипты с кэшированием
    location /cgi-bin/ {
        gzip off;
        root /var/www/wg-monitor;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Кэширование ответов CGI
        fastcgi_cache wg_cache;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 10s;  # 10 секунд для успешных ответов
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $http_cache_control;
        add_header X-Cache-Status $upstream_cache_status;
    }
    
    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Статус кэша
    location /cache-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}

# Кэширующая зона
fastcgi_cache_path /var/cache/nginx/wg levels=1:2 keys_zone=wg_cache:10m max_size=100m inactive=60m use_temp_path=off;